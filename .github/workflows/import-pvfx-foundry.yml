name: Import PVFX Foundry effects

on:
  push:
    branches: [main]
    paths:
      - "pvfx-foundry-thirteen-spritesheets.zip"
      - ".github/workflows/import-pvfx-foundry.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pvfx-foundry-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Validate and import the CC0 lit sprite sheets
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          import shutil, struct

          archive = Path("pvfx-foundry-thirteen-spritesheets.zip")
          destination = Path("assets/effects/pvfx-foundry")
          allowed_docs = {
              "pack.json", "LICENSE.txt", "README.md", "IMPORTING.md",
              "FORMAT.md", "CHANGELOG.md", "THIRD_PARTY_NOTICES.txt",
              "PROVENANCE.json", "CHECKSUMS.sha256"
          }
          if not archive.is_file():
              raise SystemExit("PVFX Foundry archive missing from main.")
          with ZipFile(archive) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit(f"ZIP integrity check failed: {bad}")
              names = [i.filename for i in z.infolist() if not i.is_dir()]
              for name in names:
                  p = PurePosixPath(name)
                  if p.is_absolute() or ".." in p.parts:
                      raise SystemExit(f"Unsafe archive path: {name}")
              selected = []
              effects = set()
              for name in names:
                  p = PurePosixPath(name)
                  parts = p.parts
                  if len(parts) >= 6 and parts[0] == "effects" and parts[-3:] in (("lit","grid","sprite-sheet.png"),("lit","grid","manifest.json")):
                      selected.append(name)
                      effects.add("/".join(parts[:3]))
                  elif len(parts) == 1 and parts[0] in allowed_docs:
                      selected.append(name)
              pngs = [n for n in selected if n.endswith("sprite-sheet.png")]
              manifests = [n for n in selected if n.endswith("manifest.json")]
              if len(effects) != 101 or len(pngs) != 101 or len(manifests) != 101:
                  raise SystemExit(f"Expected 101 effects with one lit grid sheet and manifest each; found effects={len(effects)}, sheets={len(pngs)}, manifests={len(manifests)}.")
              if destination.exists():
                  raise SystemExit("PVFX destination already exists; refusing to overwrite.")
              for name in selected:
                  target = destination / name
                  target.parent.mkdir(parents=True, exist_ok=True)
                  data = z.read(name)
                  if name.endswith("sprite-sheet.png"):
                      if len(data) < 24 or data[:8] != bytes.fromhex("89504e470d0a1a0a") or data[12:16] != b"IHDR":
                          raise SystemExit(f"Invalid PNG header: {name}")
                      width, height = struct.unpack(">II", data[16:24])
                      if width < 1 or height < 1:
                          raise SystemExit(f"Invalid PNG dimensions: {name}")
                  target.write_bytes(data)
          manifest = [
              "# PVFX Foundry 1.0 — Clone Lab Idle import",
              "",
              "- Creator: Pixel VFX Studio",
              "- Source: https://pixel-vfx-studio.itch.io/pvfx-foundry",
              "- Release: PVFX Foundry 1.0",
              "- Imported tier: Lit, fixed-grid sheets only (101 effects).",
              "- Source format: transparent PNG sprite sheets with adjacent JSON frame metadata.",
              "- Rendering: native pixel dimensions, nearest-neighbour sampling, alpha compositing.",
              "- License: CC0 1.0 Universal applies to the rendered sprite sheets and bundled metadata/documentation in the release. See LICENSE.txt for exact scope.",
              "- Suggested credit: VFX from PVFX Foundry by Pixel VFX Studio (attribution appreciated, not required).",
              "- No Pixel VFX Studio software or effect-program source is included or imported.",
              "",
              "The original archive remains at the repository root. Only the 101 Lit/grid sprite sheets, their exact manifests, pack index, and source/license documentation are copied into this folder.",
              ""
          ]
          (destination / "IMPORT_MANIFEST.md").write_text("\n".join(manifest), encoding="utf-8")
          print(f"Imported {len(effects)} effects, {len(pngs)} PNG sheets, and {len(manifests)} manifests.")
          PY
      - name: Commit imported source assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/effects/pvfx-foundry
          if git diff --cached --quiet; then
            echo "No new PVFX assets to commit."
          else
            git commit -m "Import PVFX Foundry pixel effects"
            git push origin main
          fi
