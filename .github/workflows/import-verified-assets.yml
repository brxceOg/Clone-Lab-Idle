name: Import verified asset bundle

on:
  push:
    branches: [main]
    paths:
      - "imports/Clone-Lab-Idle-verified-assets.zip"
      - "Effect and Bullet 16x16.rar"
      - "Complete_UI_Essential_Pack_Free.7z"
      - ".github/workflows/import-verified-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verified-asset-import
  cancel-in-progress: false

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install archive extraction support
        run: |
          if [ -f "Effect and Bullet 16x16.rar" ] || [ -f "Complete_UI_Essential_Pack_Free.7z" ]; then
            sudo apt-get update
            sudo apt-get install -y unar p7zip-full
          fi

      - name: Verify and extract supplied asset archive
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import shutil
          import subprocess

          temp = Path("/tmp/clone-lab-asset-import")
          shutil.rmtree(temp, ignore_errors=True)
          temp.mkdir(parents=True)

          zip_archive = Path("imports/Clone-Lab-Idle-verified-assets.zip")
          rar_archive = Path("Effect and Bullet 16x16.rar")

          if zip_archive.is_file():
              with ZipFile(zip_archive) as zf:
                  bad = zf.testzip()
                  if bad:
                      raise SystemExit(f"ZIP integrity check failed at: {bad}")
                  for item in zf.infolist():
                      target = (temp / item.filename).resolve()
                      if temp.resolve() not in target.parents and target != temp.resolve():
                          raise SystemExit(f"Unsafe archive path: {item.filename}")
                  zf.extractall(temp)

              source_assets = temp / "assets"
              if not source_assets.is_dir():
                  raise SystemExit("ZIP bundle does not contain the expected assets/ directory.")
              pngs = list(source_assets.rglob("*.png")) + list(source_assets.rglob("*.PNG"))
              if len(pngs) < 100:
                  raise SystemExit(f"Expected at least 100 PNGs in verified ZIP; found {len(pngs)}.")
              shutil.copytree(source_assets, Path("assets"), dirs_exist_ok=True)

              notes = temp / "IMPORT_NOTES.md"
              if notes.is_file():
                  destination = Path("docs/asset-import")
                  destination.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(notes, destination / "IMPORT_NOTES.md")
              print(f"Verified and staged {len(pngs)} PNG files from the verified ZIP.")

          elif rar_archive.is_file():
              extracted = temp / "rar"
              extracted.mkdir()
              subprocess.run(
                  ["unar", "-q", "-f", "-o", str(extracted), str(rar_archive.resolve())],
                  check=True
              )

              image_files = sorted(
                  p for p in extracted.rglob("*")
                  if p.is_file() and p.suffix.lower() == ".png"
              )
              if not image_files:
                  raise SystemExit("RAR archive contains no PNG sprites; refusing import.")

              destination = Path("assets/effects/effect-and-bullet-16x16")
              destination.mkdir(parents=True, exist_ok=True)
              for source in image_files:
                  relative = source.relative_to(extracted)
                  target = destination / relative
                  target.parent.mkdir(parents=True, exist_ok=True)
                  if target.exists():
                      raise SystemExit(f"Import would overwrite an existing asset: {target}")
                  shutil.copy2(source, target)

              # Preserve accompanying source/license documentation for attribution review.
              docs = [
                  p for p in extracted.rglob("*")
                  if p.is_file() and p.suffix.lower() in {".txt", ".md", ".license"}
              ]
              if docs:
                  doc_dir = Path("docs/asset-import/effect-and-bullet-16x16")
                  doc_dir.mkdir(parents=True, exist_ok=True)
                  for source in docs:
                      target = doc_dir / source.relative_to(extracted)
                      target.parent.mkdir(parents=True, exist_ok=True)
                      shutil.copy2(source, target)

              # Record the original file paths and image dimensions without resampling pixels.
              import struct

              manifest = [
                  "# Effect and Bullet 16x16 — import manifest",
                  "",
                  "Source archive: `Effect and Bullet 16x16.rar`",
                  "Imported to: `assets/effects/effect-and-bullet-16x16/`",
                  "",
                  "| File | Dimensions |",
                  "|---|---:|",
              ]
              for path in image_files:
                  with path.open("rb") as stream:
                      header = stream.read(24)
                  if len(header) < 24 or header[:8] != bytes.fromhex("89504e470d0a1a0a") or header[12:16] != b"IHDR":
                      raise SystemExit(f"Invalid PNG header: {path}")
                  width, height = struct.unpack(">II", header[16:24])
                  dimensions = f"{width}×{height}"
                  rel = path.relative_to(extracted).as_posix()
                  manifest.append(f"| `{rel}` | {dimensions} |")

              manifest_path = Path("docs/asset-import/effect-and-bullet-16x16/IMPORT_MANIFEST.md")
              manifest_path.parent.mkdir(parents=True, exist_ok=True)
              manifest_path.write_text("\n".join(manifest) + "\n", encoding="utf-8")
              print(f"Extracted {len(image_files)} PNG sprite(s) into {destination}.")
          elif Path("Complete_UI_Essential_Pack_Free.7z").is_file():
              archive = Path("Complete_UI_Essential_Pack_Free.7z")
              extracted = temp / "ui-pack"
              extracted.mkdir()
              subprocess.run(
                  ["7z", "x", "-y", f"-o{extracted}", str(archive.resolve())],
                  check=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True
              )

              image_files = sorted(
                  p for p in extracted.rglob("*")
                  if p.is_file() and p.suffix.lower() == ".png"
              )
              if not image_files:
                  raise SystemExit("7z archive contains no PNG UI assets; refusing import.")

              destination = Path("assets/ui/complete-ui-essential-pack-free")
              destination.mkdir(parents=True, exist_ok=True)
              manifest = [
                  "# Complete UI Essential Pack (Free / Flat Theme) — import manifest",
                  "",
                  "Creator: Crusenho",
                  "Source: https://crusenho.itch.io/complete-ui-essential-pack",
                  "License: Creative Commons Attribution 4.0 International (CC BY 4.0)",
                  "Attribution: Crusenho — Complete UI Essential Pack. Modified/imported for Clone Lab Idle. https://creativecommons.org/licenses/by/4.0/",
                  "",
                  "| File | Dimensions |",
                  "|---|---:|",
              ]
              import struct
              for source in image_files:
                  relative = source.relative_to(extracted)
                  target = destination / relative
                  target.parent.mkdir(parents=True, exist_ok=True)
                  if target.exists():
                      raise SystemExit(f"Import would overwrite an existing asset: {target}")
                  with source.open("rb") as stream:
                      header = stream.read(24)
                  if len(header) < 24 or header[:8] != bytes.fromhex("89504e470d0a1a0a") or header[12:16] != b"IHDR":
                      raise SystemExit(f"Invalid PNG header: {source}")
                  width, height = struct.unpack(">II", header[16:24])
                  shutil.copy2(source, target)
                  manifest.append(f"| `{relative.as_posix()}` | {width}×{height} |")

              docs = [
                  p for p in extracted.rglob("*")
                  if p.is_file() and p.suffix.lower() in {".txt", ".md", ".license"}
              ]
              doc_dir = Path("docs/asset-import/complete-ui-essential-pack-free")
              doc_dir.mkdir(parents=True, exist_ok=True)
              for source in docs:
                  target = doc_dir / source.relative_to(extracted)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(source, target)

              manifest_path = doc_dir / "IMPORT_MANIFEST.md"
              manifest_path.write_text("\\n".join(manifest) + "\\n", encoding="utf-8")
              print(f"Extracted and verified {len(image_files)} UI PNG assets into {destination}.")
          else:
              raise SystemExit("No supported asset archive was found.")
          PY

      - name: Commit imported source assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets docs/asset-import
          git rm --ignore-unmatch imports/Clone-Lab-Idle-verified-assets.zip
          git rm --ignore-unmatch "Effect and Bullet 16x16.rar"
          git rm --ignore-unmatch imports/trigger-rar-import.txt
          git rm --ignore-unmatch "Complete_UI_Essential_Pack_Free.7z"
          if git diff --cached --quiet; then
            echo "No asset changes detected."
            exit 1
          fi
          git commit -m "Import verified assets and 16x16 effects sprites"
          git push origin HEAD:main
